<!DOCTYPE html>
<html>
    <head>
        <title>Comparison of models</title>
    </head>
<body>
    <p align="center">Comparison of models</p>
    <table border="1" align="center" cellspacing="0" cellpadding="5" width="500">
        <tr>
            <th>Model</th>
            <th>OS</th>
            <th>Display</th>
            <th>RAM</th>
        </tr>
        <tr>
            <td align="center" colspan="1">Samsung<br>Galaxy S7</td>
            <td align="center" rowspan="2">Android</td>
            <td align="center" colspan="1">5.1"</td>
            <td align="center" colspan="1">4GB</td>
        </tr>
        <tr>
            <td align="center" colspan="1">Sony Xperia Z5</td>
            <td align="center" colspan="1">4.6"</td>
            <td align="center" rowspan="2">2GB</td>
        </tr>
        <tr>
            <td align="center" colspan="1">Apple iPhone 6s</td>
            <td align="center" colspan="1">iOS</td>
            <td align="center" colspan="1">4.7"</td>
        </tr>
    </table>
</body>
</html>
