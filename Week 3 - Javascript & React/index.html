<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My World</title>
    <script>
    //   console.log("Yellow World");

      let width, length, area
      width = 10;
      length = 20;
      area = width * length;
      console.log(area)

      let myNum = 10;
      let myStr = "Hello World";
      let flag = true;
      console.log(typeof myNum);
      console.log(typeof myStr);
      console.log(typeof flag);

      const PI = 3.141592653589793;
      let radius = 10;
      let areaOfCircle = PI * radius**2;
      console.log(areaOfCircle);

      const person = {
        name: "Louis",
        age: 30
      };

      person.age = 40;
      person.city = "Kota Kinabalu";
      console.log(person)

      let numArr = [2, 4, 15, 20, 35]
      let fruitArr = ["Apple", "Watermelon", "Mango"]

      console.log(numArr);
      console.log(numArr[3]);

      fruitArr[1] = "Pineapple";
      console.log(fruitArr[1]);

      let student = {
        firstName: "Max",
        lastName: "Wilfoe",
        age: 21
      };

      console.log(student.firstName);
      console.log(student["lastName"]);

      student.age = 40;
      console.log(student.age);

      let number1 = 3;
      let number2 = "3";
      console.log(number1 === number2);
      console.log(number1 == number2);

      let number3 = 0.3
      let number4 = 0.1 + 0.2
      console.log(number3 == number4)
    </script>
