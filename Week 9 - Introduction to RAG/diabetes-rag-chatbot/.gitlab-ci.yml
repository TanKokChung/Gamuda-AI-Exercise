image: node:20-alpine

stages:
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: test
  script:
    - npm run lint

build:
  stage: test
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

deploy:
  stage: deploy
  script:
    - npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
